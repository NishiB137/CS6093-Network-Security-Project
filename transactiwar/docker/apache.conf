

<VirtualHost *:443>
    # Tell Apache that the website starts inside the 'public' folder
    DocumentRoot /var/www/html/public

    # Hide Apache and PHP version from response headers
    # Without this, every HTTP response leaks "Apache/2.4.57 (Debian) PHP/8.2.x"
    # giving attackers an exact version to look up CVEs for
    # ServerTokens Prod
    # ServerSignature Off

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # SECURITY ENHANCEMENT: Disable execution in uploads
    <Directory /var/www/html/public/uploads>
        # Completely disable the PHP engine in this directory
        php_admin_flag engine off
        
        # Prevent execution of CGI scripts
        Options -ExecCGI
        
        # Prevent attackers from uploading an .htaccess to reverse these rules
        AllowOverride None
        
        Require all granted
    </Directory>
    # 


    # Strictly block direct web access to the src, logs, and database folders
    <Directory /var/www/html/src>
        Require all denied
    </Directory>
    <Directory /var/www/html/logs>
        Require all denied
    </Directory>
    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>