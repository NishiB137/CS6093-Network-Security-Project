<VirtualHost *:80>
    # Tell Apache that the website starts inside the 'public' folder
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Strictly block direct web access to the src, logs, and database folders
    <Directory /var/www/html/src>
        Require all denied
    </Directory>
    <Directory /var/www/html/logs>
        Require all denied
    </Directory>
    <Directory /var/www/html/database>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>